<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save to Hushlist</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Save to Hushlist</h1>
    <button id="open-settings" type="button" class="link">Connection</button>
  </header>

  <form id="settings" hidden>
    <p class="hint">In Hushlist, open <strong>Account and settings</strong> and choose <strong>Create an extension token</strong>. Paste it here.</p>
    <label for="set-server">Hushlist address</label>
    <input id="set-server" type="url" required placeholder="http://localhost:3456" />
    <label for="set-token">Extension token</label>
    <input id="set-token" type="password" required autocomplete="off" placeholder="hlx_…" />
    <button type="submit" class="primary">Connect</button>
  </form>

  <form id="save" hidden>
    <label for="ext-list">List</label>
    <select id="ext-list" required></select>
    <label for="ext-title">What is it?</label>
    <input id="ext-title" required maxlength="300" />
    <div class="two">
      <div><label for="ext-price">Price</label><input id="ext-price" type="number" min="0" step="0.01" /></div>
      <div><label for="ext-store">Shop</label><input id="ext-store" maxlength="120" /></div>
    </div>
    <label for="ext-variant">Size, colour, edition</label>
    <input id="ext-variant" maxlength="200" />
    <div class="two">
      <div><label for="ext-qty">How many</label><input id="ext-qty" type="number" min="1" max="999" value="1" /></div>
      <div><label for="ext-priority">How much?</label>
        <select id="ext-priority">
          <option value="most_wanted">Most wanted</option>
          <option value="high">Would love</option>
          <option value="normal" selected>Wanted</option>
          <option value="low">Nice to have</option>
        </select></div>
    </div>
    <label for="ext-notes">Note for givers</label>
    <input id="ext-notes" maxlength="2000" />
    <button type="submit" class="primary">Add to list</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
